[project]
name = "localllm"
version = "0.1.0"
description = "CLI + web UI for managing a local DFlash2 llama.cpp server stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "psutil>=5.9",
]

[project.scripts]
localllm = "localllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localllm", "web"]
