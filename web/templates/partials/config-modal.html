<template id="srv-config-modal-template">
  <div id="srv-config-body" class="px-5 py-4 max-h-[60vh] overflow-y-auto space-y-3">
    {% for p in params %}
    {% if p.is_flag %}
    <div class="flex items-center gap-2">
      <label class="w-28 shrink-0 text-xs font-mono text-zinc-400 truncate" title="{{ p.name }}">{{ p.name }}</label>
      <input type="checkbox" data-idx="{{ loop.index0 }}" data-name="{{ p.name }}" data-flag="1" checked class="rounded bg-zinc-800 border-zinc-700 text-emerald-500 focus:ring-emerald-500/30">
    </div>
    {% else %}
    <div class="flex items-center gap-2">
      <label class="w-28 shrink-0 text-xs font-mono text-zinc-400 truncate" title="{{ p.name }}">{{ p.name }}</label>
      <input type="text" data-idx="{{ loop.index0 }}" data-name="{{ p.name }}" value="{{ p.value }}" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-zinc-200 focus:outline-none focus:ring-1 focus:ring-emerald-500/50">
    </div>
    {% endif %}
    {% endfor %}
  </div>
</template>
<script type="module">
import { API, refresh } from '/static/js/core.js';

let configContext = null;

function openServerConfig() {
  configContext = window.Modal.open({
    templateId: 'srv-config-modal-template',
    variant: 'config',
    title: 'Server configuration',
    initialFocus: '#srv-config-body input',
    footerActions: [
      { label: 'Cancel', variant: 'secondary', close: true },
      { id: 'srv-config-save', label: 'Save & Restart', onClick: saveServerConfig },
    ],
    onClose: () => { configContext = null; },
  });
}

function closeServerConfig() {
  if (configContext) configContext.close();
}

async function saveServerConfig(actionContext = configContext) {
  const context = actionContext?.query ? actionContext : configContext;
  if (!context) return;
  const inputs = context.query('#srv-config-body').querySelectorAll('[data-idx]');
  const params = [];
  inputs.forEach((el) => {
    if (el.dataset.flag) {
      if (el.checked) params.push({ name: el.dataset.name, value: '', is_flag: true });
    } else {
      params.push({ name: el.dataset.name, value: el.value, is_flag: false });
    }
  });

  const btn = actionContext?.button || context.query('#srv-config-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await API.saveServerParams(params);
    await API.restartServer();
    context.close();
    refresh();
  } catch (error) {
    window.toast.error(error.message);
  } finally {
    if (btn.isConnected) {
      btn.disabled = false;
      btn.textContent = 'Save & Restart';
    }
  }
}

window.openServerConfig = openServerConfig;
window.closeServerConfig = closeServerConfig;
window.saveServerConfig = saveServerConfig;
</script>
