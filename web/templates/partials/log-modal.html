<!-- Reusable terminal log modal -->
<div id="log-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-3xl shadow-2xl flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-zinc-800">
      <div class="flex items-center gap-2.5 min-w-0">
        <h3 id="log-modal-title" class="text-sm font-semibold text-zinc-100 truncate"></h3>
        <span id="log-modal-badge" class="hidden px-2 py-0.5 rounded-full text-[10px] font-mono ring-1 ring-inset"></span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="log-modal-copy" onclick="copyLogModal()" title="Copy logs" class="p-1.5 rounded-lg text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800 transition">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button onclick="closeLogModal()" title="Close" class="p-1.5 rounded-lg text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800 transition">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <pre id="log-modal-body" class="console bg-black text-zinc-300 font-mono text-xs leading-relaxed whitespace-pre-wrap break-words h-[70vh] overflow-auto p-4"></pre>
  </div>
</div>
