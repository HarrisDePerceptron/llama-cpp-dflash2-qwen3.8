{% from "components/card.html" import card %}
{% call card('<path d="m4 17 6-6-6-6M12 19h8"/>', 'Logs', status_html='<span class="text-xs text-zinc-600 font-mono">' ~ unit ~ ' · journal</span>', col_span='lg:col-span-6') %}
<pre id="logs" class="console bg-black/60 border border-zinc-800 rounded-xl p-3 text-xs text-zinc-300 font-mono whitespace-pre-wrap h-[32rem] overflow-auto"></pre>
{% endcall %}
<script type="module">
  import { $, register } from '/static/js/core.js';

  let logsPinned = true;

  function renderLogs(ctx) {
    const el = $('logs');
    el.textContent = ctx.logs.join('\n');
    if (logsPinned) el.scrollTop = el.scrollHeight;
  }

  $('logs').addEventListener('scroll', () => {
    const el = $('logs');
    logsPinned = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  });

  register(renderLogs);
</script>
