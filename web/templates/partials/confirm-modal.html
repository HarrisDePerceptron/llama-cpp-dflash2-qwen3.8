<template id="confirm-modal-template">
  <div class="px-5 py-4">
    <div class="flex items-start gap-3">
      <span id="confirm-icon" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center bg-sky-500/10 text-sky-400">
        <svg id="confirm-icon-danger" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
        <svg id="confirm-icon-info" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </span>
      <p id="confirm-message" class="min-w-0 pt-1.5 text-sm leading-5 text-zinc-400 whitespace-pre-line"></p>
    </div>
  </div>
</template>
<script type="module">

function openConfirm({ title, message, confirmLabel = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    window.Modal.open({
      templateId: 'confirm-modal-template',
      variant: 'compact',
      title,
      closeResult: false,
      initialFocus: '#confirm-cancel',
      footerActions: [
        { id: 'confirm-cancel', label: 'Cancel', variant: 'ghost', close: true, result: false },
        { id: 'confirm-ok', label: confirmLabel, variant: danger ? 'danger' : 'primary', close: true, result: true },
      ],
      onMount: ({ query }) => {
        query('#confirm-message').textContent = message;
        const icon = query('#confirm-icon');
        icon.className = 'shrink-0 w-9 h-9 rounded-full flex items-center justify-center '
          + (danger ? 'bg-red-500/10 text-red-400' : 'bg-sky-500/10 text-sky-400');
        query('#confirm-icon-danger').classList.toggle('hidden', !danger);
        query('#confirm-icon-info').classList.toggle('hidden', danger);
      },
      onClose: resolve,
    });
  });
}

window.openConfirm = openConfirm;
</script>
