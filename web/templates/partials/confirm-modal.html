<div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
  <div class="w-full max-w-sm rounded-xl border border-zinc-800 bg-zinc-900 shadow-2xl">
    <div class="px-5 py-4">
      <div class="flex items-start gap-3">
        <span id="confirm-icon" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center bg-sky-500/10 text-sky-400">
          <svg id="confirm-icon-danger" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
          <svg id="confirm-icon-info" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </span>
        <div class="min-w-0">
          <h2 id="confirm-title" class="text-sm font-semibold text-zinc-100"></h2>
          <p id="confirm-message" class="mt-1 text-sm text-zinc-400 whitespace-pre-line"></p>
        </div>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-4 border-t border-zinc-800">
      <button id="confirm-cancel" class="px-3 py-1.5 rounded-lg text-sm text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition-colors">Cancel</button>
      <button id="confirm-ok" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-sky-500 hover:bg-sky-400 text-zinc-950 transition-colors"></button>
    </div>
  </div>
</div>
<script type="module">
  import { $, setBtn } from '/static/js/core.js';

  let confirmResolve = null;

  function openConfirm({ title, message, confirmLabel = 'Confirm', danger = false }) {
    return new Promise((resolve) => {
      confirmResolve = resolve;
      $('confirm-title').textContent = title;
      $('confirm-message').textContent = message;
      setBtn($('confirm-ok'), danger ? 'danger' : 'primary', confirmLabel);
      const icon = $('confirm-icon');
      icon.className = 'shrink-0 w-9 h-9 rounded-full flex items-center justify-center ' + (danger ? 'bg-red-500/10 text-red-400' : 'bg-sky-500/10 text-sky-400');
      $('confirm-icon-danger').classList.toggle('hidden', !danger);
      $('confirm-icon-info').classList.toggle('hidden', danger);
      const modal = $('confirm-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      $('confirm-cancel').focus();
    });
  }

  function closeConfirm(result) {
    const modal = $('confirm-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    const resolve = confirmResolve;
    confirmResolve = null;
    if (resolve) resolve(result);
  }

  $('confirm-cancel').addEventListener('click', () => closeConfirm(false));
  $('confirm-ok').addEventListener('click', () => closeConfirm(true));
  $('confirm-modal').addEventListener('click', (e) => {
    if (e.target === $('confirm-modal')) closeConfirm(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (confirmResolve) closeConfirm(false);
  });

  window.openConfirm = openConfirm;
</script>
