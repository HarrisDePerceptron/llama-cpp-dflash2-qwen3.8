<!-- Reusable confirmation modal -->
{% from "partials/_button.html" import button %}
<div id="confirm-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
    <div class="px-5 py-4">
      <div class="flex items-start gap-3">
        <div id="confirm-icon" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center"></div>
        <div class="min-w-0 pt-0.5">
          <h3 id="confirm-title" class="text-sm font-semibold text-zinc-100"></h3>
          <p id="confirm-message" class="mt-1 text-sm text-zinc-400 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-zinc-800 bg-zinc-950/40">
      {{ button('Cancel', variant='secondary', id='confirm-cancel') }}
      {{ button('', id='confirm-ok') }}
    </div>
  </div>
</div>
