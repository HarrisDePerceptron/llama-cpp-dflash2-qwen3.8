{% from "components/card.html" import card %}
{% from "components/progress.html" import progress %}
{% call card('<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>', 'System', col_span='lg:col-span-2') %}
<div class="space-y-4">
  <div>
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-sm text-zinc-400">CPU</span>
      <span class="text-xs font-mono text-zinc-300" id="sys-cpu">…</span>
    </div>
    {{ progress('sys-cpu-bar') }}
    <div class="mt-1 text-[11px] text-zinc-600" id="sys-load"></div>
  </div>
  <div>
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-sm text-zinc-400">RAM</span>
      <span class="text-xs font-mono text-zinc-300" id="sys-mem">…</span>
    </div>
    {{ progress('sys-mem-bar') }}
  </div>
  <div class="flex items-center justify-between text-sm">
    <span class="text-zinc-400">Swap</span>
    <span class="text-xs font-mono text-zinc-300" id="sys-swap">…</span>
  </div>
</div>
{% endcall %}
<script type="module">
  import { $, register } from '/static/js/core.js';

  function renderSystem(ctx) {
    const s = ctx.system;
    $('sys-cpu').textContent = `${s.cpu_percent}%`;
    $('sys-cpu-bar').style.width = s.cpu_percent + '%';
    $('sys-load').textContent = s.load_avg ? `load ${s.load_avg.map((x) => x.toFixed(2)).join('  ')}` : '';
    $('sys-mem').textContent = `${s.mem_used_gb} / ${s.mem_total_gb} GB`;
    $('sys-mem-bar').style.width = s.mem_percent + '%';
    $('sys-swap').textContent = `${s.swap_used_gb} / ${s.swap_total_gb} GB`;
  }

  register(renderSystem);
</script>
