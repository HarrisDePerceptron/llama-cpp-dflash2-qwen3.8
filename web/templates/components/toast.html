<div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex flex-col items-end gap-2"></div>
<script type="module">
  import { $ } from '/static/js/core.js';

  const TOAST_BASE = 'pointer-events-auto flex max-w-[calc(100vw-2rem)] items-start gap-2.5 rounded-xl border bg-zinc-900/95 px-3.5 py-2.5 text-sm text-zinc-200 shadow-lg backdrop-blur-sm transition-all duration-200 sm:max-w-sm';
  const VARIANTS = {
    error: {
      border: 'border-red-500/30',
      icon: 'text-red-400',
      path: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
      role: 'alert',
    },
    success: {
      border: 'border-emerald-500/30',
      icon: 'text-emerald-400',
      path: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      role: 'status',
    },
    info: {
      border: 'border-sky-500/30',
      icon: 'text-sky-400',
      path: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
      role: 'status',
    },
  };

  function makeIcon(path, className) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    svg.classList.add('mt-0.5 shrink-0', className);
    svg.innerHTML = path;
    return svg;
  }

  function dismiss(el) {
    if (!el.isConnected) return;
    el.classList.add('translate-y-1', 'opacity-0');
    const remove = () => el.remove();
    el.addEventListener('transitionend', remove, { once: true });
    setTimeout(remove, 300);
  }

  function show(message, { variant = 'info', duration = 4500 } = {}) {
    const style = VARIANTS[variant] || VARIANTS.info;
    const el = document.createElement('div');
    el.className = TOAST_BASE + ' ' + style.border + ' translate-y-1 opacity-0';
    el.setAttribute('role', style.role);
    el.append(makeIcon(style.path, style.icon));
    const msg = document.createElement('div');
    msg.className = 'min-w-0 break-words';
    msg.textContent = message;
    el.append(msg);
    $('toast-root').append(el);
    requestAnimationFrame(() => el.classList.remove('translate-y-1', 'opacity-0'));
    let timer = null;
    if (duration > 0) timer = setTimeout(() => dismiss(el), duration);
    el.addEventListener('click', () => {
      if (timer) clearTimeout(timer);
      dismiss(el);
    });
    return el;
  }

  window.toast = Object.freeze({
    show,
    error: (message, opts) => show(message, { variant: 'error', ...opts }),
    success: (message, opts) => show(message, { variant: 'success', ...opts }),
    info: (message, opts) => show(message, { variant: 'info', ...opts }),
  });
</script>
